plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whisper.wowreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whisper.wowreader'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '2.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
