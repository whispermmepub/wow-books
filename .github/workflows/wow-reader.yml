name: Build WoW Reader APK

on:
  push:
    branches:
      - wow-reader-app
    paths:
      - 'android-wow-reader/**'
      - '.github/workflows/wow-reader.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p android-wow-reader :app:assembleRelease --stacktrace

      - name: Collect unsigned APK and signer
        shell: bash
        run: |
          cp android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v1.0.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Unsigned
          path: |
            WoW-Reader-v1.0.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7
