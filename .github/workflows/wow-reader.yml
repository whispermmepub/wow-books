name: Build WoW Reader APK

on:
  push:
    branches:
      - wow-reader-app
    paths:
      - 'android-wow-reader/**'
      - '.github/workflows/wow-reader.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android EPUB parser compatibility fix
        shell: bash
        run: |
          sed -i '/f\.setXIncludeAware(false);/d' android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          ! grep -q "setXIncludeAware(false)" android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          grep -q "versionCode 9" android-wow-reader/app/build.gradle
          grep -q "versionName '1.7.0'" android-wow-reader/app/build.gradle
          test -s android-wow-reader/app/src/main/res/drawable/wow_logo.webp

      - name: Apply v1.7 smooth page engine
        run: python3 android-wow-reader/patch_reader_v170.py

      - name: Page engine safety checks
        shell: bash
        run: |
          READER=android-wow-reader/app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Page by page' "$READER"
          grep -q 'pageTurnLocked' "$READER"
          grep -q 'window.__wowPageEngine' "$READER"
          grep -q 'column-width:86vw' "$READER"
          grep -q 'column-gap:14vw' "$READER"
          grep -q 'putString("epub_reading_mode", readingMode)' "$READER"
          ! grep -q 'window.scrollTo({left:' "$READER"
          python3 - <<'PY'
          # Model the production page-index contract: a valid tap changes at most one page.
          for count in range(1, 151):
              for page in range(count):
                  for delta in (-1, 1):
                      if delta < 0 and page == 0:
                          result = ('chapter', page)
                      elif delta > 0 and page == count - 1:
                          result = ('chapter', page)
                      else:
                          result = ('page', max(0, min(count - 1, page + delta)))
                      if result[0] == 'page':
                          assert abs(result[1] - page) == 1
                      else:
                          assert result[1] == page
          print('page-index contract passed')
          PY

      - name: Bundle Myanmar reader fonts
        shell: bash
        run: |
          mkdir -p android-wow-reader/app/src/main/assets/fonts
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Pyidaungsu.woff2 -o android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-A10_YoeShin-Regular.woff2 -o android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Burma2-Normal.woff2 -o android-wow-reader/app/src/main/assets/fonts/burma2.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/burma2.woff2

      - name: Build release APK
        run: gradle -p android-wow-reader :app:assembleRelease --stacktrace

      - name: Android lint
        run: gradle -p android-wow-reader :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          APK=android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='9'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='1.7.0'"

      - name: Collect unsigned APK and signer
        shell: bash
        run: |
          cp android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v1.7.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Unsigned
          path: |
            WoW-Reader-v1.7.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7
