name: Build WoW Reader APK

on:
  push:
    branches:
      - wow-reader-app
    paths:
      - 'android-wow-reader/**'
      - '.github/workflows/wow-reader.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android EPUB parser compatibility fix
        shell: bash
        run: |
          sed -i '/f\.setXIncludeAware(false);/d' android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          ! grep -q "setXIncludeAware(false)" android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          grep -q "versionCode 12" android-wow-reader/app/build.gradle
          grep -q "versionName '2.0.0'" android-wow-reader/app/build.gradle
          grep -q "play-services-auth:21.6.0" android-wow-reader/app/build.gradle
          grep -q "android.permission.INTERNET" android-wow-reader/app/src/main/AndroidManifest.xml
          test -s android-wow-reader/app/src/main/res/drawable/wow_logo.webp

      - name: Apply Android 6 compatibility fixes
        run: python3 android-wow-reader/patch_android23_compat.py

      - name: Apply v1.7 smooth page engine base
        run: python3 android-wow-reader/patch_reader_v170.py

      - name: Apply v1.8 smart Burmese pagination base
        run: python3 android-wow-reader/patch_reader_v180.py

      - name: Apply v1.9 isolated pages and smart justify
        run: python3 android-wow-reader/patch_reader_v190.py

      - name: Apply v2.0 paper page turn and sync timestamps
        run: python3 android-wow-reader/patch_reader_v200.py

      - name: Apply v2.0 home and Google Drive account sync
        run: python3 android-wow-reader/patch_home_v200.py

      - name: Reader and cloud safety checks
        shell: bash
        run: |
          READER=android-wow-reader/app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          HOME=android-wow-reader/app/src/main/java/com/whisper/wowreader/MainActivity.java
          DRIVE=android-wow-reader/app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q 'Page by page' "$READER"
          grep -q 'wow-page-viewport' "$READER"
          grep -q 'flow.style.width=pw' "$READER"
          grep -q 'flow.style.columnWidth=pw' "$READER"
          grep -q 'flow.style.columnGap=gap' "$READER"
          grep -q 'Math.round((sw+st.gapPx)/st.step)' "$READER"
          grep -q 'Text alignment' "$READER"
          grep -q 'Justify' "$READER"
          grep -q 'Auto spacing adjustment' "$READER"
          grep -q 'text-justify:inter-character' "$READER"
          grep -q 'fontPercent = 100' "$READER"
          grep -q 'lineSpacing = 160' "$READER"
          grep -q 'marginPercent = 5' "$READER"
          grep -q 'Page animation' "$READER"
          grep -q 'Paper · default' "$READER"
          grep -q 'st.paperTurn' "$READER"
          grep -q 'perspective(1200px)' "$READER"
          grep -q 'sync_updated_ms' "$READER"
          grep -q 'https://t.me/TheBookR' "$HOME"
          grep -q 'https://saroatsin.com' "$HOME"
          grep -q 'https://www.googleapis.com/auth/drive.file' "$HOME"
          grep -q 'AuthorizationRequest.Prompt.SELECT_ACCOUNT' "$HOME"
          grep -q 'GoogleDriveSync.sync' "$HOME"
          grep -q 'maybeAutoSync' "$HOME"
          grep -q 'FOLDER_NAME = "WoW Reader"' "$DRIVE"
          grep -q 'www.googleapis.com/drive/v3' "$DRIVE"
          grep -q 'upload/drive/v3' "$DRIVE"
          ! grep -q 'window.scrollTo({left:' "$READER"
          python3 - <<'PY'
          # One page step must be exactly one viewport wide at representative phone widths.
          for viewport in [320, 360, 393, 412, 480, 600, 720, 1080, 1440]:
              for margin_pct in [3, 5, 7, 9, 12, 14]:
                  margin = round(viewport * margin_pct / 100)
                  page_width = viewport - 2 * margin
                  gap = viewport - page_width
                  assert page_width + gap == viewport
                  assert page_width > 0
                  for page in range(20):
                      x = margin - page * viewport
                      next_x = margin - (page + 1) * viewport
                      assert x - next_x == viewport
          # Page-index contract: one valid input changes exactly one page.
          for count in range(1, 201):
              for page in range(count):
                  for delta in (-1, 1):
                      if delta < 0 and page == 0:
                          result = ('chapter', page)
                      elif delta > 0 and page == count - 1:
                          result = ('chapter', page)
                      else:
                          result = ('page', page + delta)
                      if result[0] == 'page':
                          assert abs(result[1] - page) == 1
                      else:
                          assert result[1] == page
          print('v2.0 page, paper-turn and cloud contracts passed')
          PY

      - name: Bundle Myanmar reader fonts
        shell: bash
        run: |
          mkdir -p android-wow-reader/app/src/main/assets/fonts
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Pyidaungsu.woff2 -o android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-A10_YoeShin-Regular.woff2 -o android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Burma2-Normal.woff2 -o android-wow-reader/app/src/main/assets/fonts/burma2.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/burma2.woff2

      - name: Build release APK
        run: gradle -p android-wow-reader :app:assembleRelease --stacktrace

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p android-wow-reader :app:lintRelease --stacktrace
          RC=$?
          REPORT=android-wow-reader/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
          exit $RC

      - name: APK smoke checks
        shell: bash
        run: |
          APK=android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='12'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.0.0'"
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'

      - name: Collect unsigned APK and signer
        shell: bash
        run: |
          cp android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.0.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Unsigned
          path: |
            WoW-Reader-v2.0.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7
