name: Build WoW Reader APK

on:
  push:
    branches: [wow-reader-app]
    paths:
      - 'android-wow-reader/**'
      - '.github/workflows/wow-reader.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Base project checks
        shell: bash
        run: |
          sed -i '/f\.setXIncludeAware(false);/d' android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          ! grep -q "setXIncludeAware(false)" android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          grep -q "versionCode 14" android-wow-reader/app/build.gradle
          grep -q "versionName '2.2.0'" android-wow-reader/app/build.gradle
          grep -q "play-services-auth:21.6.0" android-wow-reader/app/build.gradle
          grep -q "android.permission.INTERNET" android-wow-reader/app/src/main/AndroidManifest.xml
          test -s android-wow-reader/app/src/main/res/drawable/wow_logo.webp
          test -s android-wow-reader/app/src/main/java/com/whisper/wowreader/PageCurlView.java

      - name: Apply Android 6 compatibility fixes
        run: python3 android-wow-reader/patch_android23_compat.py

      - name: Apply v1.7 page engine base
        run: python3 android-wow-reader/patch_reader_v170.py

      - name: Apply v1.8 Burmese pagination base
        run: python3 android-wow-reader/patch_reader_v180.py

      - name: Apply v1.9 exact pages and smart justify
        run: python3 android-wow-reader/patch_reader_v190.py

      - name: Apply v2.0 paper animation and sync timestamps
        run: python3 android-wow-reader/patch_reader_v200.py

      - name: Apply v2.0 home and Google Drive sync
        run: python3 android-wow-reader/patch_home_v200.py

      - name: Restore SAF lint annotation
        run: python3 android-wow-reader/patch_home_v200_lint.py

      - name: Apply v2.1 EPUB title cleanup
        run: python3 android-wow-reader/patch_epub_v210.py

      - name: Apply v2.1 native curl and glass reader UI
        run: python3 android-wow-reader/patch_reader_v210.py

      - name: Restore v2.1 reader helper
        run: python3 android-wow-reader/patch_reader_v210_compile_fix.py

      - name: Apply v2.2 exact EPUB TOC and spine filtering
        run: python3 android-wow-reader/patch_epub_v220.py

      - name: Apply v2.2 exact pages and dark theme fixes
        run: python3 android-wow-reader/patch_reader_v220.py

      - name: Restore v2.2 native curl block
        run: python3 android-wow-reader/patch_reader_v220_restore_curl.py

      - name: Reader and cloud safety checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = {
              'reader': Path('android-wow-reader/app/src/main/java/com/whisper/wowreader/BookReaderActivity.java').read_text(),
              'curl': Path('android-wow-reader/app/src/main/java/com/whisper/wowreader/PageCurlView.java').read_text(),
              'epub': Path('android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java').read_text(),
              'home': Path('android-wow-reader/app/src/main/java/com/whisper/wowreader/MainActivity.java').read_text(),
              'drive': Path('android-wow-reader/app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java').read_text(),
          }
          checks = {
              'reader': ['prefs.getString("epub_reading_mode", "page")', 'wow-page-viewport', 'flow.style.width=pw', 'Text alignment',
                         'Auto spacing adjustment', 'text-justify:inter-character', 'fontPercent = 100',
                         'lineSpacing = 160', 'marginPercent = 5', 'Page animation', 'Paper · default',
                         'startNativePageCurl', 'finishPendingChapterCurl', 'setBackgroundBlurRadius',
                         'tocSpineIndices', 'tocFragments', 'collectPageMap', 'onEmptyChapter',
                         'goToFragment', 'headingFg', 'break-before', 'private String jsQuote(String', 'sync_updated_ms'],
              'curl': ['drawBitmapMesh', 'MESH_W = 34', 'LinearGradient', 'PathInterpolator',
                       'drawCurledBitmap(canvas, fromBitmap, progress, direction)', 'hold(Bitmap current)'],
              'epub': ['isGenericTitle(result.title)', 'isGenericTitle(info.title)', 'titleFromFilename',
                       'tocSpineIndices', 'collectNavEntries', 'collectNcxEntries', 'hasReadableContent',
                       '"no".equalsIgnoreCase(ref.getAttribute("linear"))', 'fragmentFromHref', 'isAuxiliaryTocLabel'],
              'home': ['https://t.me/TheBookR', 'https://saroatsin.com',
                       'https://www.googleapis.com/auth/drive.file', 'AuthorizationRequest.Prompt.SELECT_ACCOUNT',
                       'GoogleDriveSync.sync', 'maybeAutoSync', '@SuppressLint("WrongConstant")'],
              'drive': ['FOLDER_NAME = "WoW Reader"', 'www.googleapis.com/drive/v3',
                        'upload/drive/v3', 'STATE_NAME', 'Google Drive sync failed'],
          }
          missing = []
          for group, patterns in checks.items():
              for pattern in patterns:
                  if pattern not in files[group]:
                      missing.append(f'{group}: {pattern}')
          if 'window.scrollTo({left:' in files['reader']:
              missing.append('reader: old horizontal scroll engine still present')
          if missing:
              print('MISSING CONTRACTS:')
              print('\n'.join(missing))
              raise SystemExit(1)

          for physical_map in ([0], [0, 1, 2], [0, 2, 3, 7], [1, 4, 8, 9, 15]):
              for logical in range(len(physical_map)):
                  for delta in (-1, 1):
                      target = logical + delta
                      if 0 <= target < len(physical_map):
                          assert abs(target - logical) == 1
                          assert physical_map[target] != physical_map[logical]

          auxiliary = {'cover', 'cover page', 'title page', 'copyright', 'about us',
                       'contents', 'table of contents', 'toc', 'publisher', 'imprint'}
          assert 'cover' in auxiliary and 'about us' in auxiliary
          print('v2.2 exact TOC, blank-page map, dark mode and curl contracts passed')
          PY

      - name: Bundle Myanmar reader fonts
        shell: bash
        run: |
          mkdir -p android-wow-reader/app/src/main/assets/fonts
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Pyidaungsu.woff2 -o android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-A10_YoeShin-Regular.woff2 -o android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Burma2-Normal.woff2 -o android-wow-reader/app/src/main/assets/fonts/burma2.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          test -s android-wow-reader/app/src/main/assets/fonts/burma2.woff2

      - name: Build release APK
        run: gradle -p android-wow-reader :app:assembleRelease --stacktrace

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p android-wow-reader :app:lintRelease --stacktrace
          RC=$?
          REPORT=android-wow-reader/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
          exit $RC

      - name: APK smoke checks
        shell: bash
        run: |
          APK=android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='14'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.2.0'"
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'

      - name: Collect unsigned APK and signer
        shell: bash
        run: |
          cp android-wow-reader/app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.2.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Unsigned
          path: |
            WoW-Reader-v2.2.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7
